  Windows:
    name: Windows
    runs-on: windows-latest
    needs: PrepareRelease
    # needs: CheckCode
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Get npm cache directory
        shell: pwsh
        run: echo "NPM_CACHE=$(npm config get cache)" >> $env:GITHUB_ENV

      - name: Show Env
        run: echo "${{ env.NPM_CACHE }}"

      - name: Setup Node Env
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Build src code
        run: |
          git status --porcelain
          npm run build

      - name: Release package
        shell: bash
        run: |
          set -euo pipefail
          npm run publish:win:7z:x64
          npm run publish:win:7z:arm64
          npm run publish:win:setup:arm64
          npm run publish:win:setup:x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BT_TOKEN: ${{ secrets.BT_TOKEN }}

      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$(node -p 'require("./package.json").version')"
          count=$(gh release view "$tag" --json assets -q '.assets | length')
          echo "Release ${tag} 当前附件数量: ${count}"
          if [ "$count" -lt 4 ]; then
            echo "::error::Release ${tag} 附件数量异常(${count})，产物未上传成功"
            exit 1
          fi

      - name: Generate file MD5
        run: |
          cd build
          Get-FileHash *.exe,*.7z -Algorithm MD5 | Format-List
